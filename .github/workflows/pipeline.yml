name: Playwright Tests

on:
  push:
    branches: [ main, master, fix/*, feat/*, hotfix/*, chore/*, bugfix/*, release/* ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Runs Monday-Friday at 8:00 AM, 12:00 PM, and 5:00 PM IST.
    # GitHub Actions cron uses UTC, so these are 2:30 AM, 6:30 AM, and 11:30 AM UTC.
    - cron: '30 2,6,11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write   # needed for the gh-pages publish step below
  actions: write     # needed to delete old artifacts in the cleanup step below

concurrency:
  group: allure-gh-pages
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      # Artifact storage is capped per-account/repo. This workflow uploads a
      # 400+ file HTML report on every run (3x/day schedule + every push/PR),
      # which can exhaust the quota and make new uploads fail outright. Purge
      # old artifacts from this repo before uploading a new one so the quota
      # never fills up. Note: GitHub's quota usage is recalculated every
      # 6-12 hours, so this alone doesn't undo a quota hit instantly, but it
      # stops it from recurring.
      - name: Delete old artifacts
        continue-on-error: true
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate --jq '.artifacts[] | select(.expired==false) | .id' \
            | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      # allure-commandline (already in your devDependencies) needs a JVM to run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: run_tests
        continue-on-error: true
        env:
          EMAIL_ID: ${{ secrets.EMAIL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          # BASE_URL: ${{ vars.BASE_URL }}
          # ENV_API: ${{ vars.ENV_API }}
        # run: npx playwright test tests/UI/sales tests/API
        run: npx playwright test salesEnquirySample.spec.ts

      # Guarantee this exists even if 0 tests ran or the run crashed early,
      # so the Allure generate step never fails on a missing directory.
      - name: Ensure allure-results folder exists
        if: ${{ !cancelled() }}
        run: mkdir -p allure-results

      # Pull previous Allure history so the report shows pass/fail trend graphs
      # across runs, not just the current one. Safe to fail on first-ever run
      # (gh-pages branch won't exist yet).
      - name: Checkout gh-pages for Allure history
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Allure history into results (for trend graphs)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ -d "gh-pages/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/* allure-results/history/
          fi

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report

      # Uploaded artifact is mainly a fallback for branches that don't publish
      # to GitHub Pages (main/master does, via the step further down) and now
      # expires quickly (7 days) instead of 30 to keep storage usage low.
      - name: Upload Allure HTML report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
          if-no-files-found: warn

      # GitHub hard-blocks any git push containing a file over 100MB.
      # Playwright traces (captured on failure) can embed full network
      # request/response bodies and occasionally blow past that limit,
      # which then causes the "Publish to GitHub Pages" step below to be
      # rejected outright (pre-receive hook declined) and nothing deploys.
      # This strips any such oversized attachment out of the report before
      # we publish, so the rest of the report (results, screenshots, trend
      # graphs) still goes live. The link for that one huge trace will 404,
      # but nothing else breaks.
      - name: Strip oversized attachments before publishing to Pages
        if: ${{ !cancelled() }}
        run: |
          find allure-report -type f -size +90M -print -delete || true

      # Publishes to GitHub Pages so you get a persistent, directly-viewable
      # link instead of downloading+unzipping an artifact (Allure's static
      # HTML needs to be served, it won't work opened via file://).
      # One-time setup required: repo Settings -> Pages -> Source: "Deploy
      # from a branch" -> Branch: gh-pages. Only runs on main/master pushes.
      - name: Publish Allure report to GitHub Pages
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          force_orphan: true          # rewrite gh-pages fresh each deploy: avoids
                                       # fast-forward push races and stops old
                                       # runs' large attachments piling up forever

      - name: Write Allure report link to job summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Allure Report" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "Live report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This branch does not publish to GitHub Pages. Download the **allure-report** artifact above, then run \`npx allure open allure-report\` locally to view it." >> "$GITHUB_STEP_SUMMARY"
          fi

      # continue-on-error above means the job would otherwise show green
      # even when tests fail. Fail it for real here, after reports are saved.
      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1